plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// runData 输出挂进资源源集，随 jar 打包（勿手动改 generated 文件）。
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 只在 neoforge.mods.toml 上做占位符展开，其它资源文件原样复制。
// 注意：expand 底层是 Groovy 模板引擎，会把它看到的任何“美元号+花括号”片段
// 当作表达式求值——资源文件里出现非占位符的该类写法会让构建以模板解析失败报错。
processResources {
    // toml 里实际用到的占位符（只用这些，比 expand project.properties 更好追踪）。
    def tomlExpansions = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            mod_description        : mod_description,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
    ]
    // 必须把展开用的属性显式声明成 inputs：expand() 不会自动登记它们，否则只改
    // gradle.properties（例如 mod_version）时本任务会被判 UP-TO-DATE，打出来的 jar 里
    // mods.toml 会留着上一次的旧值，出现「文件名 1.0.1、toml 里写 1.0.0」这种不一致。
    inputs.properties(tomlExpansions)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand tomlExpansions
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
