org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge（两值必须对应同一 MC 版本）
minecraft_version=1.21.1
# 与本工作区其它工程保持一致：moddev 2.0.91 + Gradle 8.14.2 + NeoForge 21.1.176
# （本地缓存已就绪，21.1.176 构建出的 jar 在运行时 21.1.250 上正常工作）
neo_version=21.1.176

# 依赖版本区间（neoforge.mods.toml 的 dependencies 用）
minecraft_version_range=[1.21.1]
neo_version_range=[21.1,)

# Mod metadata（mod_id 与 @Mod 注解必须一致）
mod_id=enchantransformer
# 注意：gradle.properties 按 ISO-8859-1 解析，非 ASCII 必须写成 \uXXXX 转义
# \u9644\u9B54\u8F6C\u79FB\u53F0 = 附魔转移台
mod_name=\u9644\u9B54\u8F6C\u79FB\u53F0
mod_version=1.0.1
mod_group_id=com.homemine.enchanttransformer
mod_authors=THEDIMS
mod_license=MIT
mod_description=Enchantment Transfuser: a block that moves enchantments from one item to another, one at a time, charging experience levels (4 normal / 6 treasure / 7 curse).
